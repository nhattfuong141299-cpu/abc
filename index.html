const recipes=[
 {name:'🍜 Mì trứng rau',need:{noodle:1,egg:1,veg:1},steps:[['🔥 Bật bếp — làm nóng',15],['💧 Đun nước sôi',10],['🍜 Pha mì',5],['🍽️ Bê ra bàn',5]]},
 {name:'🍳 Trứng rau',need:{egg:2,veg:1},steps:[['🔥 Bật bếp — làm nóng',8],['🍳 Chiên trứng',8],['🥬 Cho rau',5],['🍽️ Bê ra bàn',5]]}
];
function recipeText(r){return Object.entries(r.need).map(([k,n])=>{const names={rice:'🍚 Gạo',veg:'🥬 Rau',fish:'🐟 Cá',meat:'🥩 Thịt',shrimp:'🦐 Tôm',egg:'🥚 Trứng',noodle:'🍜 Mì'};return `${names[k]} ${S.inventory[k]}/${n}`}).join(' · ')}
function cook(){
  if(S.scene!=='home')returnHomeScene();
  if(S.cooking)return toast('🍳 Món đang được nấu, làm xong món này trước nhé');
  show(`<h2>🍳 Chọn món nấu</h2><p class="card">Chọn món trước. <b>Nguyên liệu chỉ bị trừ khi bạn bắt đầu nấu</b>.</p><div class="cards">${recipes.map((r,i)=>`<div class="card"><b>${r.name}</b><p>${recipeText(r)}</p><button class="btn pink" onclick="startCooking(${i})">${Object.entries(r.need).every(([k,n])=>S.inventory[k]>=n)?'🍳 Nấu món này':'🔒 Thiếu nguyên liệu'}</button></div>`).join('')}</div>${btn('🧊 Xem tủ lạnh','fridge()','choice')}`)
}
async function startCooking(i){
  const r=recipes[i];
  for(const k in r.need){if((S.inventory[k]||0)<r.need[k])return toast('🧊 Thiếu nguyên liệu — vào Cửa hàng để mua thêm');}
  if(S.busy)return toast('⏳ Hai người đang bận, chờ một chút');
  closeModal();
  S.busy=true;
  try{await moveNPC('boy',34,47,'Để anh lấy đồ!');await moveNPC('girl',23,49,'Em nấu nhé 😋');}
  finally{S.busy=false}
  for(const k in r.need)S.inventory[k]-=r.need[k];
  S.cooking={recipe:r,step:0,remain:r.steps[0][1],deadline:0,timer:null,serveTimer:null};
  renderCookStep();
}
function renderCookStep(){
  const c=S.cooking;if(!c)return;
  const step=c.recipe.steps[c.step];
  show(`<h2>🍳 ${c.recipe.name}</h2><p><b>Bước ${c.step+1}/${c.recipe.steps.length}: ${step[0]}</b></p><div class="taskbar"><i id="cookbar" style="width:100%"></i></div><p>Còn <b id="cooktime">${step[1]}</b> giây</p><p class="card">Nguyên liệu đã được lấy từ tủ lạnh. Không thể mua thực phẩm trong màn này — muốn mua, hãy vào <b>🛒 Cửa hàng</b>.</p><button class="btn pink" id="cookWait">🔥 Bắt đầu bước</button>`);
  $('cookWait').onclick=()=>runCookTimer();
}
function runCookTimer(){
  const c=S.cooking;if(!c||c.timer)return;
  const step=c.recipe.steps[c.step];let remain=step[1];
  const b=$('cookWait');if(b){b.disabled=true;b.textContent='⏳ Đang thực hiện...'}
  c.timer=setInterval(()=>{
    remain--;if($('cooktime'))$('cooktime').textContent=remain;if($('cookbar'))$('cookbar').style.width=(remain/step[1]*100)+'%';
    if(remain<=0){clearInterval(c.timer);c.timer=null;finishCookStep()}
  },1000);
}
async function finishCookStep(){
  const c=S.cooking;if(!c)return;
  c.step++;
  if(c.step>=c.recipe.steps.length){
    S.cooking=null;effect('love',4);effect('happy',4);effect('trust',2);changeTime(1);hud();
    await routine('table');
    show(`<h2>🍽️ Món ăn đã được bê ra bàn</h2><div class="card">Hai người ăn tối cùng nhau. Không nhận tiền — đây là bữa cơm của nhà mình ❤️</div>${btn('🥢 Ăn cùng nhau','eatMeal()')}`);return;
  }
  if(c.step===c.recipe.steps.length-1){
    c.deadline=5;
    show(`<h2>🍽️ ${c.recipe.name} đã chín!</h2><p class="card">Món đã chín. Bấm <b>Bê ra bàn</b> để hoàn tất. Nếu chưa muốn bê, bạn vẫn có thể thao tác trong 5 giây.</p><button class="btn pink" id="serveBtn" onclick="serveMeal()">🍽️ Bê ra bàn ngay</button>`);
    let n=5;c.serveTimer=setInterval(()=>{n--;if($('serveBtn'))$('serveBtn').textContent=`🍽️ Bê ra bàn ngay (${n}s)`;if(n<=0){clearInterval(c.serveTimer);c.serveTimer=null;if(S.cooking)fireReset()}},1000);return;
  }
  renderCookStep();
}
async function serveMeal(){
  const c=S.cooking;if(!c)return;
  if(c.serveTimer){clearInterval(c.serveTimer);c.serveTimer=null}
  S.cooking=null;effect('love',4);effect('happy',4);effect('trust',2);changeTime(1);hud();
  await routine('table');
  show(`<h2>🍽️ Đã bê món ra bàn</h2><div class="card">Bữa cơm gia đình hoàn thành. Không nhận tiền — đây là đồ ăn cho hai người ❤️</div>${btn('🥢 Ăn cùng nhau','eatMeal()')}`)
}
async function eatMeal(){if(S.scene!=='home')returnHomeScene();effect('love',3);effect('happy',5);effect('anger',-2);changeTime(20);hud();toast('🍜 Bữa tối ngon lành ❤️');await routine('table')}
function fireReset(){if(S.cooking){if(S.cooking.timer)clearInterval(S.cooking.timer);if(S.cooking.serveTimer)clearInterval(S.cooking.serveTimer);S.cooking=null}effect('anger',5);effect('happy',-3);hud();toast('😅 Món nguội mất rồi — không cháy nhà đâu!');setTimeout(()=>fridge(),250)}
function chores(){const list=[['dish','🍽️ Rửa bát','girl','💦'],['laundry','👕 Giặt quần áo','boy','🫧'],['trash','🗑️ Đổ rác','girl','🗑️'],['floor','🧹 Lau nhà','boy','🧹']];show('<h2>6. 🧹 Việc nhà</h2><p>Chạm vào việc — NPC sẽ đi tới đúng chỗ, thực hiện hành động rồi mới hoàn thành.</p>'+list.map(([k,x,w,fxi])=>`<button class="choice" onclick="doChore('${k}','${w}','${fxi}')">${S.chores[k]?'☑️':'⬜'} ${x}</button>`).join('')+'<p class="card">Độ sạch nhà: '+S.clean+'%</p>')}
async function doChore(k,who,icon){if(S.chores[k]||S.busy)return;closeModal();if(S.scene!=='home')returnHomeScene();S.busy=true;const pos={dish:[68,61],laundry:[78,75],trash:[15,62],floor:[55,72]}[k];const labels={dish:'Đang rửa bát...',laundry:'Đang giặt quần áo...',trash:'Đang mang rác đi...',floor:'Đang lau nhà...'};try{await moveNPC(who,pos[0],pos[1]);const c=$(who);if(c)c.classList.add('working');const fxEl=document.createElement('div');fxEl.className='homeAction';fxEl.textContent=icon+' '+labels[k];fxEl.style.left=Math.min(76,pos[0])+'%';fxEl.style.top=Math.max(8,pos[1]-12)+'%';$('world').appendChild(fxEl);await waitMs(4500);fxEl.remove();if(c)c.classList.remove('working');S.chores[k]=true;S.clean=clamp(S.clean+5);effect('happy',2);effect('anger',-2);changeTime(8);hud();say(k==='dish'?'Rửa bát xong! 💦':k==='laundry'?'Quần áo giặt xong rồi! 🫧':k==='trash'?'Đổ rác xong 😎':'Nhà sạch rồi! 🧹',who);chores()}finally{S.busy=false}}
function live(){homeSchedule();show(`<h2>🏠 Hoạt động tự do</h2><p>Chọn một hoạt động. Bạn có thể ở đó khoảng <b>1 phút</b>, còn người yêu sẽ tự quyết định việc của họ.</p><div class="cards"><button class="choice" onclick="startFreeActivity('cook')">🍳 Nấu nướng tự do<br><small>Ở bếp 1 phút</small></button><button class="choice" onclick="startFreeActivity('tv')">📺 Xem TV tự do<br><small>Ngồi sofa 1 phút</small></button><button class="choice" onclick="coupleTalk()">💬 Tâm sự</button></div>`)}
function startFreeActivity(type){if(S.scene!=='home')return;closeModal();if(S.freeActive)return toast('Đang có một hoạt động');S.freeActive={type,remain:60,partnerAction:'Đang tự do'};S.busy=true;const pos=type==='cook'?[30,47]:[43,55];moveNPC(S.player,pos[0],pos[1]);if(type==='tv')tvOn();else toast('🍳 Bạn đang nấu nướng tự do');setTimeout(()=>freeActivityLoop(),850)}
async function freeActivityLoop(){if(!S.freeActive)return;const a=S.freeActive;const c=$(S.player);if(c)c.classList.add('working');const title=a.type==='cook'?'🍳 Đang nấu nướng':'📺 Đang xem TV';const panel=document.createElement('div');panel.className='homeAction';panel.id='freeActivityHUD';panel.style.left='3%';panel.style.top='4%';panel.innerHTML=`${title}<div class="freeTimer">60s</div><div class="aiLog" id="aiLog">🤖 Người yêu đang tự quyết định...</div>`;$('world').appendChild(panel);let last=Date.now();let elapsed=0;while(S.freeActive&&elapsed<60){await waitMs(1000);if(!S.freeActive)break;elapsed++;a.remain=60-elapsed;const t=$('freeActivityHUD');if(t){t.querySelector('.freeTimer').textContent=a.remain+'s';}if(elapsed%7===0)await partnerAI();}if(panel.parentNode)panel.remove();if(c)c.classList.remove('working');S.freeActive=null;S.busy=false;if(a.type==='tv'){$('.tv-screen').style.display='none';}effect('happy',3);effect('love',2);changeTime(60);hud();toast('⏱️ Hoạt động tự do kết thúc');homeSchedule()}
async function partnerAI(){if(!S.partner||S.scene!=='home'||S.h>=7&&S.h<11||S.h>=14&&S.h<17)return;const choices=['tv','cook','table','pet','tidy','talk'];const pick=choices[Math.floor(Math.random()*choices.length)];const log=$('aiLog');const p=S.partner;if(pick==='tv'){await moveNPC(p,57,57,'Em xem TV một chút nhé 📺');tvOn();if(log)log.textContent='🤖 Người yêu tự chọn: xem TV';}else if(pick==='cook'){await moveNPC(p,23,49,'Để em phụ bếp 😋');if(log)log.textContent='🤖 Người yêu tự chọn: phụ nấu ăn';}else if(pick==='table'){await moveNPC(p,61,68,'Em ngồi chờ cơm ❤️');if(log)log.textContent='🤖 Người yêu tự chọn: ngồi bàn ăn';}else if(pick==='pet'){await moveNPC(p,70,68,'Miu ơi, lại đây nào 🐾');await petMove(70,65);if(log)log.textContent='🤖 Người yêu tự chọn: chơi với thú cưng';}else if(pick==='tidy'){const k=Object.keys(S.chores).find(x=>!S.chores[x]);if(k){const pos={dish:[68,61],laundry:[78,75],trash:[15,62],floor:[55,72]}[k];await moveNPC(p,pos[0],pos[1],'Để em dọn một chút 🧹');S.chores[k]=true;S.clean=clamp(S.clean+4);if(log)log.textContent='🤖 Người yêu tự chọn: dọn dẹp';}}else{await moveNPC(p,55,58,'Hôm nay ở nhà vui ghê ❤️');effect('love',1);if(log)log.textContent='🤖 Người yêu tự chọn: tâm sự';}}
function coupleTalk(){effect('love',5);effect('trust',4);effect('happy',4);hud();say('Hôm nay của anh/em thế nào?',S.partner);toast('💬 Hai người nói chuyện với nhau')}

function phone(){show(`<h2>2. 📱 Điện thoại</h2><p>Tin nhắn đến bất chợt. Có nhiều người nhắn, không chỉ người yêu.</p><div class="cards"><button class="choice" onclick="inbox()">💬 Tin nhắn ${S.unread?'<span class="notif">'+S.unread+'</span>':''}</button><button class="choice" onclick="social()">📸 MXH</button><button class="choice" onclick="petMenu()">🐾 Thú cưng</button><button class="choice" onclick="finance()">🏦 Ngân hàng</button><button class="choice" onclick="status()">📊 Trạng thái</button><button class="choice" onclick="characterMenu()">👤 Nhân vật</button></div>`)}
function inbox(){show(`<h2>3. 💬 Tin nhắn</h2>${Object.entries(contacts).map(([k,c])=>`<button class="choice" onclick="chat('${k}')">${c.avatar} <b>${c.name}</b>${S.inbox[k].length?'<span class="notif" style="float:right">'+S.inbox[k].length+'</span>':''}</button>`).join('')}`)}
function chat(k){const c={...contacts[k]};if(k==='love')c.name='❤️ '+S.partnerName;const arr=S.inbox[k];let text=c.messages[S.messageSeq%c.messages.length];if(arr.length)text=arr.shift();S.unread=Math.max(0,S.unread-1);show(`<h2>${c.avatar} ${c.name}</h2><div class="chat"><div class="bubble">${text[0]}</div><div class="bubble me">${text[1]}</div></div><div style="display:flex;gap:6px;margin-top:8px"><input id="chatInput" maxlength="120" placeholder="Nhập tin nhắn..." style="flex:1;padding:11px;border:2px solid #dac4a4;border-radius:10px;font-size:13px"><button class="btn pink" style="width:90px;margin-top:0" onclick="sendMessage('${k}')">Gửi</button></div>${k==='love'?`<p><b>Phản hồi nhanh:</b></p>${btn('❤️ Anh chỉ nói chuyện với em.','replyLove("good")','choice')}${btn('😅 Bạn thôi mà.','replyLove("soft")','choice')}${btn('🙄 Đang bận, lát nói.','replyLove("bad")','choice')}`:''}${btn('⬅️ Danh sách','inbox()')}`)}
function sendMessage(k){const input=$('chatInput');const text=(input?.value||'').trim();if(!text)return toast('Viết gì đó trước đã 😅');if(k==='love'){const low=text.toLowerCase();if(/(trà sữa|trasua|đi chơi|tối nay)/.test(low)){effect('anger',4);effect('trust',-1)}else if(/(yêu|nhớ|thương|ăn chưa|nấu|về chưa)/.test(low)){effect('love',3);effect('trust',2);effect('anger',-2)}else effect('trust',1)}else effect('trust',1);S.messageSeq++;changeTime(2);hud();toast('📤 Đã gửi tin nhắn');chat(k)}
function replyLove(t){if(t==='good'){effect('trust',5);effect('love',3);effect('anger',-6)}if(t==='soft'){effect('trust',2);effect('anger',-1)}if(t==='bad'){effect('trust',-5);effect('anger',7)}changeTime(5);hud();toast(t==='bad'?'😤 Người yêu bắt đầu nghi ngờ':'❤️ Tin tưởng tăng');chat('love')}
function genericReply(k){effect('trust',1);changeTime(2);hud();toast('Đã trả lời '+contacts[k].name);chat(k)}
function randomMessage(){const keys=Object.keys(contacts);const k=keys[Math.floor(Math.random()*keys.length)];const c={...contacts[k]};if(k==='love')c.name='❤️ '+S.partnerName;const m=c.messages[Math.floor(Math.random()*c.messages.length)];S.inbox[k].push(m);S.unread++;fx('📱',82,15);toast('📱 '+c.name+' vừa nhắn');}

(function(){

    if(!before && S.cooking){S.v22.stats.cooks++;v22Memory('Hai người đã bắt đầu nấu '+S.cooking.recipe.name);v22Log('Bắt đầu nấu '+S.cooking.recipe.name);}
  };
  window.startCooking=window.v21StartCooking;

  // 2) Eating is remembered and affects daily needs.
  const _meal=v21StartMeal;
  window.v21StartMeal=function(){
    _meal();
    v22ActivityNeed('eat');
    v22Memory('Cùng nhau ăn một bữa cơm.');
    v22Log('Hai người ăn cùng nhau');
  };

  // 3) Free TV/sofa activities feed the fun need.
  const _activity=v21StartActivity;
  window.v21StartActivity=function(type,title,ms){
    _activity(type,title,ms);
    if(type==='tv'||type==='sofa')v22ActivityNeed('tv');
  };

  // 4) Pet feeding is now a counted, memorable activity.
  const _petFeed=petFeed;
  window.petFeed=function(kind){
    const before=S.pet.food?.[kind]||0;
    _petFeed(kind);
    if(before>(S.pet.food?.[kind]||0)){S.v22.stats.petFeeds++;v22Memory('Cho '+S.pet.name+' ăn.');v22Log('Cho thú cưng ăn');}
  };

  // 5) Work has levels and the work scene remains clean instead of speech bubbles.
  window.v22DoWork=function(k,label,max){
    if(!v21CanWork())return toast('💼 Đã hết giờ làm. Ca làm dừng tại 17:30.');
    if(S.v21.work)return toast('⏳ Bạn đang làm '+S.v21.work.label);
    if(S.energy<12)return toast('🥱 Năng lượng quá thấp — nghỉ một chút trước đã.');
    const level=1+Math.floor((S.v22.stats.work||0)/5);
    const sec=Math.max(4,8-level);

  window.invitePartner26=invitePartner26;

  // Web: housing + jobs + shopping + quick opportunities.
  function web26(){show('<h2>🌐 WEB</h2><div class="v26-list"><button class="choice" onclick="rooms26()">🏠 Tìm trọ<small>Thuê phòng lớn hơn để mở khóa cuộc sống.</small></button><button class="choice" onclick="invitePartner26()">❤️ Mời người yêu về ở<small>'+(room().partner?'Phòng hiện tại đủ cho 2 người.':'Cần nâng cấp phòng trước.')+'</small></button><button class="choice" onclick="jobBoard26()">💼 Việc làm<small>Shipper, quán phở, văn phòng.</small></button><button class="choice" onclick="quickJobs26()">⚡ Cơ hội nhanh<small>Tiền cao, deadline và rủi ro cao.</small></button><button class="choice" onclick="storeShelves26()">🛒 Mua sắm<small>Thực phẩm, thú cưng, thiết bị.</small></button></div>');}
  function rooms26(){show('<h2>🏠 TÌM TRỌ</h2><div class="v26-list">'+Object.entries(G.rooms).map(([k,r])=>`<div class="v26-card"><b>${r.name}</b><br>${r.desc}<br>💰 ${fmt(r.rent)}/7 ngày · Cọc ${fmt(r.deposit)} · ${r.capacity} người<br>${k===S.v26.room?'<b>Đang ở đây</b>':`<button class="btn pink" onclick="rent26('${k}')">Thuê</button>`}</div>`).join('')+'</div>');}
  function rent26(k){const r=G.rooms[k];if(r.level<=room().level)return toast('🏠 Chỉ nâng cấp lên phòng cao hơn');const cost=r.rent+r.deposit;if(S.money<cost)return toast('💸 Cần '+fmt(cost)+' cho cọc + 7 ngày đầu');S.money-=cost;S.v26.room=k;S.v26.rentUntil=S.day+6;S.petUnlocked=r.pet;room();renderHomeObjects();if(r.partner){toast('❤️ Phòng đủ chỗ để mời người yêu');}log26('Thuê '+r.name+' -'+fmt(cost));closeModal();toast('🏠 Đã chuyển sang '+r.name);}
  function jobBoard26(){show('<h2>💼 BẢNG VIỆC LÀM</h2><div class="v26-list">'+Object.entries(G.jobs).map(([k,j])=>`<button class="choice" onclick="goCity();setTimeout(()=>enterPlace26('${k}'),100)"><b>${j.name}</b><small>${j.hours}<br>${j.desc}<br>💰 ${fmt(j.pay)}/task</small></button>`).join('')+'</div>');}
  function quickJobs26(){show('<h2>⚡ CƠ HỘI NHANH</h2><div class="v26-card v26-risk"><b>Giao 3 đơn trong 20 phút</b><br>💰 180.000đ<br>⚠️ Trễ deadline: chỉ nhận 50.000đ.</div><button class="btn gold" onclick="quickJobStart26()">🛵 Nhận job</button><div class="v26-card v26-risk"><b>Dọn kho 30 phút</b><br>💰 220.000đ<br>⚡ Tốn nhiều năng lượng.</div><button class="btn gold" onclick="quickJobWarehouse26()">📦 Nhận job</button>');}
  function quickJobStart26(){if(S.energy<30)return toast('⚡ Không đủ năng lượng');S.energy=clamp(S.energy-25);changeTime(20);S.money+=180000;log26('Hoàn thành job giao gấp +180k');toast('⚡ Job gấp thành công +180.000đ');closeModal();}
  function quickJobWarehouse26(){if(S.energy<35)return toast('⚡ Không đủ năng lượng');S.energy=clamp(S.energy-35);changeTime(30);S.money+=220000;log26('Hoàn thành dọn kho +220k');toast('⚡ Job thời vụ +220.000đ');closeModal();}
  window.web26=web26;window.rooms26=rooms26;window.rent26=rent26;window.jobBoard26=jobBoard26;window.quickJobs26=quickJobs26;window.quickJobStart26=quickJobStart26;window.quickJobWarehouse26=quickJobWarehouse26;

  // Phone and tabs.
  window.phone=function(){show('<h2>📱 ĐIỆN THOẠI</h2><div class="v26-list"><button class="choice" onclick="web26()">🌐 WEB<small>Tìm trọ · việc làm · mua sắm · cơ hội nhanh</small></button><button class="choice" onclick="inbox()">💬 TIN NHẮN<small>Người yêu, bạn bè, gia đình, đồng nghiệp</small></button><button class="choice" onclick="history26()">📒 NHẬT KÝ<small>Những gì đã xảy ra trong cuộc sống</small></button></div>');};
  function history26(){show('<h2>📒 NHẬT KÝ</h2><div class="v26-log">'+(S.v26.history.length?S.v26.history.map(x=>'<div>'+x+'</div>').join(''):'Chưa có sự kiện.')+'</div>');}
  window.history26=history26;
  function jobTab(){show('<h2>💼 ĐI LÀM</h2><div class="v26-card">Muốn làm việc, hãy chọn nghề rồi bước vào địa điểm thật. Ca làm không có câu hỏi thi.</div><button class="btn gold" onclick="web26()">🌐 Mở bảng việc</button>');}
  function dateTab(){goCity();setTimeout(()=>enterPlace26('park'),80);}
  function shopTab(){goCity();setTimeout(()=>enterPlace26('store'),80);}
  document.querySelectorAll('nav button').forEach(b=>{b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const k=b.dataset.tab;if(k==='home'){closeModal();$('tv-screen').style.display='none';setScene('home','', '');rebuild26();}else if(k==='phone')phone();else if(k==='work')jobTab();else if(k==='date')dateTab();else if(k==='shop')shopTab();};});

  // Economy: rent + living costs, never game-over.
  function economy26(){
    if(S.day!==S.v26.lastExpenseDay){S.v26.lastExpenseDay=S.day;const c=25000;S.money=Math.max(0,S.money-c);effect('finance',-1);log26('Chi phí sinh hoạt -25k');}
    if(S.day>S.v26.rentUntil){const r=room();if(S.money>=r.rent){S.money-=r.rent;S.v26.rentUntil=S.day+6;log26('Tiền phòng -'+fmt(r.rent));toast('🏠 Đã trả tiền phòng '+fmt(r.rent));}else{effect('trust',-2);effect('happy',-3);toast('⚠️ Chưa đủ tiền phòng — cần đi làm');}}
    hud();
  }
  // Background tick: cooking, economy, NPC life.
  setInterval(()=>{cookingTick26();economy26();if(S.scene==='home'&&S.partnerAtHome&&Math.random()<.06)partnerAI26();},1000);
  async function partnerAI26(){if(!S.partnerAtHome||S.scene!=='home'||S.v26.cooking)return;const t=S.h*60+S.m;if(t>=420&&t<690){await move(S.partner,35,48,'Em phụ bếp một chút.');pose(S.partner,'cook');}else if(t>=1080&&t<1320&&room().objects.includes('tv')){await move(S.partner,66,57,'Xem TV một lát.');pose(S.partner,'sit');}}
  window.partnerAI26=partnerAI26;

  // Pet becomes available only after the player obtains a pet-capable room and buys food/toy.
  function pet26(){if(!S.petUnlocked)return toast('🐾 Chưa có thú cưng');if(!$('pet'))return;show('<h2>🐾 '+S.pet.name+'</h2><div class="v26-card">Đói: '+S.pet.hunger+'/100 · Vui: '+S.pet.happy+'/100</div><button class="choice" onclick="feedPet26()">🥣 Cho ăn<small>Mua thức ăn ở Cửa hàng</small></button><button class="choice" onclick="playPet26()">🎾 Chơi</button>');}
  function feedPet26(){if(!S.petUnlocked)return;if((S.v26.petFood||0)<=0)return toast('🥣 Hết thức ăn');S.v26.petFood--;S.pet.hunger=clamp(S.pet.hunger+20);S.pet.happy=clamp(S.pet.happy+5);move('pet',75,73);v20FX('🍖',75,70);log26('Cho Miu ăn');toast('🐾 Miu ăn ngon lành');}
  function playPet26(){S.pet.happy=clamp(S.pet.happy+10);S.pet.energy=clamp(S.pet.energy-8);move('pet',60,70);log26('Chơi với Miu');toast('🎾 Miu chạy chơi');}
  window.pet26=pet26;window.feedPet26=feedPet26;window.playPet26=playPet26;


  // Initial visual state.
  rebuild26();sync26();
  toast('🌅 Ngày 1 · 1.000.000đ · bắt đầu một mình');
})();
</script>
</body></html>
